<!DOCTYPE html>
<html lang="pt">
<head>

  <script>
    /* Base path automático para GitHub Pages (repo em subpasta) */
    (function () {
      try {
        var path = location.pathname;
        var dir = path.endsWith('/') ? path : path.replace(/\/[^\/]*$/, '/');
        if (!document.querySelector('base')) {
          var b = document.createElement('base');
          b.href = location.origin + dir;
          document.head.insertBefore(b, document.head.firstChild);
        }
      } catch (e) {}
    })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <title>Compras — Bónus Lodja - Compre e ganhe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">B</div>
        <div><h1>Bónus Lodja - Compre e ganhe</h1><span>Painel Admin</span></div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item"><span class="icon">📊</span> Dashboard</a>
        <a href="clientes.html" class="nav-item"><span class="icon">👥</span> Clientes</a>
        <a href="compras.html" class="nav-item active"><span class="icon">🛒</span> Compras</a>
        <a href="elegiveis.html" class="nav-item"><span class="icon">⭐</span> Elegíveis</a>
        <a href="sorteios.html" class="nav-item"><span class="icon">🎡</span> Sorteios</a>
        <a href="premios.html" class="nav-item"><span class="icon">🎁</span> Prémios</a>
        <a href="entregas.html" class="nav-item"><span class="icon">📦</span> Entregas</a>
        <a href="relatorios.html" class="nav-item"><span class="icon">📈</span> Relatórios</a>
        <a href="bonus-especial.html" class="nav-item" target="_blank"><span class="icon">🔥</span> Bónus Especial</a>
        <a href="configuracoes.html" class="nav-item"><span class="icon">⚙️</span> Configurações</a>
      </nav>
      <div class="sidebar-footer">
        <button class="nav-item" onclick="Auth.logout()"><span class="icon">🚪</span> Sair</button>
      </div>
    </aside>
    <div class="sidebar-overlay"></div>

    <div class="main-content">
      <header class="topbar">
        <div class="d-flex align-center gap-2">
          <button class="menu-toggle">☰</button>
          <h2>Compras</h2>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-primary" onclick="openNovaCompra()">+ Nova Compra</button>
        </div>
      </header>

      <div class="content">
        <div class="card">
          <div class="card-header">
            <div class="search-box">
              <input type="text" id="search" class="form-control" placeholder="Pesquisar por cliente ou factura...">
            </div>
          </div>
          <div class="card-body">
            <table>
              <thead>
                <tr>
                  <th>Data</th>
                  <th>Cliente</th>
                  <th>Factura</th>
                  <th>Peças</th>
                  <th>Valor</th>
                  <th>Observação</th>
                  <th>Acções</th>
                </tr>
              </thead>
              <tbody id="tabelaCompras"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Nova Compra -->
  <div class="modal-overlay" id="modalCompra">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalCompraTitle">Nova Compra</h3>
        <button class="btn btn-outline btn-sm" onclick="App.closeModal('modalCompra')">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Cliente *</label>
          <select id="clienteId" class="form-control" required>
            <option value="">Seleccione o cliente...</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Nº da Factura</label>
            <input type="text" id="numeroFactura" class="form-control" placeholder="Automático (001, 002...)" readonly>
            <small class="text-muted" style="font-size:11px">Gerado automaticamente pelo sistema</small>
          </div>
          <div class="form-group">
            <label>Quantidade de Peças *</label>
            <input type="number" id="quantidadePecas" class="form-control" min="1" value="1" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Valor da Compra</label>
            <input type="number" id="valor" class="form-control" min="0" step="0.01" placeholder="0.00">
          </div>
          <div class="form-group">
            <label>Data</label>
            <input type="date" id="data" class="form-control">
          </div>
        </div>
        <div class="form-group">
          <label>Observação</label>
          <textarea id="observacao" class="form-control" rows="2"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="App.closeModal('modalCompra')">Cancelar</button>
        <button class="btn btn-primary" id="btnSalvarCompra" onclick="salvarCompra()">Registar Compra</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="storage.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script>
    initSupabase();
    if (!Auth.requireAuth()) throw new Error("Não autenticado");

    async function popularClientes() {
      const select = document.getElementById('clienteId');
      const clientes = (await Storage.getClientes()).filter(c => c.estado === 'activo');
      select.innerHTML = '<option value="">Seleccione o cliente...</option>' +
        clientes.map(c => `<option value="${c.id}">${App.escapeHtml(c.nome)} (${c.telefone || 's/n'})</option>`).join('');
    }

    async function render() {
      const search = document.getElementById('search').value.toLowerCase();
      let compras = await Storage.getCompras();
      const clientes = await Storage.getClientes();
      const map = Object.fromEntries(clientes.map(c => [c.id, c]));

      if (search) {
        compras = compras.filter(c => {
          const cl = map[c.clienteId];
          return (cl?.nome || '').toLowerCase().includes(search) ||
                 (c.numeroFactura || '').toLowerCase().includes(search);
        });
      }

      const tbody = document.getElementById('tabelaCompras');
      if (compras.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="icon">🛒</div><h4>Nenhuma compra registada</h4></div></td></tr>`;
        return;
      }

      tbody.innerHTML = compras.map(c => {
        const cliente = map[c.clienteId];
        return `
          <tr>
            <td>${App.formatDate(c.data)}</td>
            <td>${App.escapeHtml(cliente?.nome || '—')}</td>
            <td>${App.escapeHtml(c.numeroFactura || '—')}</td>
            <td><strong>${c.quantidadePecas}</strong></td>
            <td>${c.valor ? Number(c.valor).toLocaleString('pt-PT') + ' MZN' : '—'}</td>
            <td>${App.escapeHtml(c.observacao || '—')}</td>
            <td>
              <button class="btn btn-outline btn-sm" onclick="editarCompra('${c.id}')">Editar</button>
              <button class="btn btn-factura btn-sm" onclick="imprimirFactura('${c.id}')">📄 Factura</button>
              <button class="btn btn-danger btn-sm" onclick="apagarCompra('${c.id}')">Apagar</button>
            </td>
          </tr>`;
      }).join('');
    }

    let editCompraId = null;

    async function openNovaCompra() {
      editCompraId = null;
      document.getElementById('modalCompraTitle').textContent = 'Nova Compra';
      document.getElementById('btnSalvarCompra').textContent = 'Registar Compra';
      await popularClientes();
      document.getElementById('clienteId').value = '';
      const next = await Storage.nextFacturaNumero();
      document.getElementById('numeroFactura').value = next;
      document.getElementById('numeroFactura').readOnly = true;
      document.getElementById('quantidadePecas').value = 1;
      document.getElementById('valor').value = '';
      document.getElementById('data').value = new Date().toISOString().split('T')[0];
      document.getElementById('observacao').value = '';
      App.openModal('modalCompra');
    }

    async function editarCompra(id) {
      const compras = await Storage.getCompras();
      const c = compras.find(x => x.id === id);
      if (!c) return;
      editCompraId = id;
      document.getElementById('modalCompraTitle').textContent = 'Editar Compra';
      document.getElementById('btnSalvarCompra').textContent = 'Guardar Alterações';
      await popularClientes();
      document.getElementById('clienteId').value = c.clienteId || '';
      document.getElementById('numeroFactura').value = c.numeroFactura || '';
      document.getElementById('numeroFactura').readOnly = false;
      document.getElementById('quantidadePecas').value = c.quantidadePecas || 1;
      document.getElementById('valor').value = c.valor || '';
      document.getElementById('data').value = c.data || '';
      document.getElementById('observacao').value = c.observacao || '';
      App.openModal('modalCompra');
    }

    async function salvarCompra() {
      const clienteId = document.getElementById('clienteId').value;
      const quantidadePecas = parseInt(document.getElementById('quantidadePecas').value) || 0;
      if (!clienteId) { App.toast('Seleccione o cliente', 'error'); return; }
      if (quantidadePecas < 1) { App.toast('Quantidade inválida', 'error'); return; }
      const payload = {
        clienteId,
        numeroFactura: document.getElementById('numeroFactura').value.trim(),
        quantidadePecas,
        valor: parseFloat(document.getElementById('valor').value) || 0,
        data: document.getElementById('data').value,
        observacao: document.getElementById('observacao').value.trim()
      };
      try {
        if (editCompraId) {
          await Storage.updateCompra(editCompraId, payload);
          App.toast('Compra actualizada!', 'success');
        } else {
          const criada = await Storage.addCompra(payload);
          App.toast(`Compra registada! Factura nº ${criada.numeroFactura}`, 'success');
        }
        const cliente = await Storage.getClienteById(clienteId);
        if (cliente && cliente.elegivel) App.toast(`${cliente.nome} está ELEGÍVEL!`, 'success', 4000);
        App.closeModal('modalCompra');
        editCompraId = null;
        await render();
      } catch (e) {
        console.error(e);
        App.toast('Erro: ' + (e.message || e), 'error');
      }
    }

    function fecharDocView() {
      const el = document.getElementById('docPrintView');
      if (el) el.remove();
      document.body.style.overflow = '';
    }

    function abrirDocView(htmlConteudo) {
      fecharDocView();
      const wrap = document.createElement('div');
      wrap.id = 'docPrintView';
      wrap.setAttribute('style', 'position:fixed;inset:0;z-index:99999;background:#f8fafc;overflow:auto;-webkit-overflow-scrolling:touch;');
      wrap.innerHTML = `
        <div class="toolbar-doc" style="position:sticky;top:0;z-index:2;display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 14px;box-shadow:0 4px 12px rgba(15,23,42,.06)">
          <button type="button" id="btnDocVoltar" style="display:inline-flex;align-items:center;gap:6px;background:#0f172a;color:#fff;border:none;border-radius:10px;padding:12px 16px;font-weight:600;font-size:14px;cursor:pointer;min-height:44px">← Voltar ao Menu Principal</button>
          <button type="button" id="btnDocImprimir" style="display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:10px;padding:12px 16px;font-weight:600;font-size:14px;cursor:pointer;min-height:44px">🖨 Imprimir</button>
        </div>
        <div id="docPrintBody" style="padding:16px;max-width:720px;margin:0 auto"></div>
      `;
      document.body.appendChild(wrap);
      document.body.style.overflow = 'hidden';
      document.getElementById('docPrintBody').innerHTML = htmlConteudo;
      document.getElementById('btnDocVoltar').onclick = function () {
        fecharDocView();
      };
      document.getElementById('btnDocImprimir').onclick = function () {
        try {
          window.print();
        } catch (e) {
          App.toast('Use a partilha do telemóvel ou a opção Imprimir do sistema.', 'info', 4000);
        }
      };
    }

    async function imprimirFactura(id) {
      const compras = await Storage.getCompras();
      const c = compras.find(x => x.id === id);
      if (!c) return;
      const cliente = await Storage.getClienteById(c.clienteId);
      const cfg = await Storage.getConfig();
      const loja = cfg.nomeLoja || 'Bónus Lodja - Compre e ganhe';
      const logo = cfg.logoUrl ? `<img src="${cfg.logoUrl}" alt="Logo" style="width:56px;height:56px;border-radius:10px;object-fit:cover">` : '';
      const corpo = `
        <style>
          @media print {
            #docPrintView .toolbar-doc { display: none !important; }
            body > *:not(#docPrintView) { display: none !important; }
            #docPrintView { position: static !important; overflow: visible !important; background: #fff !important; }
          }
        </style>
        <div style="background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:28px;color:#0f172a;font-family:Inter,Arial,sans-serif">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:2px solid #6366f1;padding-bottom:16px;margin-bottom:24px;flex-wrap:wrap">
            <div style="display:flex;align-items:center;gap:12px">${logo}<div><h1 style="font-size:22px;margin:0 0 4px">${loja}</h1><div style="color:#64748b;font-size:13px">Factura de compra</div></div></div>
            <div><strong>Nº:</strong> ${c.numeroFactura || '—'}<br><strong>Data:</strong> ${c.data || '—'}</div>
          </div>
          <p><strong>Cliente:</strong> ${(cliente && cliente.nome) || '—'}<br>
          <strong>Telefone:</strong> ${(cliente && cliente.telefone) || '—'}</p>
          <table style="width:100%;border-collapse:collapse;margin-top:16px">
            <thead><tr>
              <th style="border:1px solid #e2e8f0;padding:10px;background:#f1f5f9;text-align:left">Descrição</th>
              <th style="border:1px solid #e2e8f0;padding:10px;background:#f1f5f9;text-align:left">Peças</th>
              <th style="border:1px solid #e2e8f0;padding:10px;background:#f1f5f9;text-align:left">Valor</th>
            </tr></thead>
            <tbody><tr>
              <td style="border:1px solid #e2e8f0;padding:10px">Compra / artigos</td>
              <td style="border:1px solid #e2e8f0;padding:10px">${c.quantidadePecas}</td>
              <td style="border:1px solid #e2e8f0;padding:10px">${c.valor ? Number(c.valor).toLocaleString('pt-PT') + ' MZN' : '—'}</td>
            </tr></tbody>
          </table>
          ${c.observacao ? '<p style="color:#64748b;font-size:13px">Obs: ' + App.escapeHtml(c.observacao) + '</p>' : ''}
          <div style="font-size:18px;font-weight:700;margin-top:20px;text-align:right;color:#4f46e5">Total: ${c.valor ? Number(c.valor).toLocaleString('pt-PT') + ' MZN' : '—'}</div>
          <p style="margin-top:40px;color:#64748b;font-size:13px">Documento gerado pelo sistema Bónus Lodja</p>
        </div>
      `;
      abrirDocView(corpo);
    }

    async function apagarCompra(id) {
      if (!App.confirm('Apagar esta compra?')) return;
      try {
        await Storage.deleteCompra(id);
        App.toast('Compra apagada', 'success');
        await render();
      } catch (e) {
        App.toast('Erro ao apagar', 'error');
      }
    }

    document.getElementById('search').addEventListener('input', () => render());
    render();
  </script>
</body>
</html>
