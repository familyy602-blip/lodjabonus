<!DOCTYPE html>
<html lang="pt">
<head>

  <script>
    /* Base path automático para GitHub Pages (repo em subpasta) */
    (function () {
      try {
        var path = location.pathname;
        var dir = path.endsWith('/') ? path : path.replace(/\/[^\/]*$/, '/');
        if (!document.querySelector('base')) {
          var b = document.createElement('base');
          b.href = location.origin + dir;
          document.head.insertBefore(b, document.head.firstChild);
        }
      } catch (e) {}
    })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <title>Roleta de Prémios — Bónus Lodja - Compre e ganhe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="roleta.css">
  <style>
    .acesso-form {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 28px 24px;
      max-width: 400px;
      margin: 0 auto;
      text-align: left;
    }
    .acesso-form h2 {
      text-align: center;
      font-size: 20px;
      margin-bottom: 8px;
      color: #f1f5f9;
    }
    .acesso-form .desc {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .acesso-form .form-group {
      margin-bottom: 16px;
    }
    .acesso-form label {
      display: block;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .acesso-form input {
      width: 100%;
      padding: 12px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #f1f5f9;
      font-size: 15px;
      font-family: inherit;
    }
    .acesso-form input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.25);
    }
    .acesso-form .btn-verificar {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .acesso-form .btn-verificar:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(99,102,241,0.4);
    }
    .acesso-form .erro-msg {
      background: rgba(239,68,68,0.15);
      color: #f87171;
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      margin-bottom: 16px;
      text-align: center;
      display: none;
    }
    .acesso-form .erro-msg.show { display: block; }
    .ou-divisor {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      margin: 20px 0 12px;
    }
  </style>
</head>
<body>
  <div class="roleta-page">
    <div class="roleta-container" id="app">
      <!-- Conteúdo dinâmico -->
    </div>
    <div class="roleta-footer" id="roletaFooter">
      <div style="margin-bottom:10px">Bónus Lodja - Compre e ganhe · Sorteio de clientes fiéis</div>
      <a href="dashboard.html" id="btnVoltarPainel" style="display:inline-block;color:#a5b4fc;font-size:14px;text-decoration:none;font-weight:600">← Voltar ao painel admin</a>
    </div>
  </div>

  <div class="confetti-container" id="confetti"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
  <script>
    initSupabase();

    // Admin: mostrar botão voltar ao painel
    (function showAdminBack() {
      try {
        const btn = document.getElementById('btnVoltarPainel');
        if (!btn) return;
        if (sessionStorage.getItem('admin_logged') === 'true') {
          btn.textContent = '← Voltar ao painel admin';
          btn.href = 'dashboard.html';
        } else {
          btn.textContent = 'Área admin';
          btn.href = 'login.html';
        }
        btn.style.display = 'inline-block';
      } catch (e) {}
    })();

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const modoEspecial = params.get('modo') === 'especial';
    const app = document.getElementById('app');

    // ========== MODO BÓNUS ESPECIAL (sem regra das 5 peças) ==========
    if (modoEspecial) {
      initRoletaBonusEspecial();
    } else if (token) {
      // ========== MODO 1: Link exclusivo com token ==========
      initRoletaPorToken(token);
    } else {
      // ========== MODO 2: Acesso público (grupo WhatsApp / 5 peças) ==========
      mostrarFormularioAcesso();
    }

    function isAdminTeste() {
      try {
        const q = new URLSearchParams(location.search);
        return q.get('teste') === '1' && sessionStorage.getItem('admin_logged') === 'true';
      } catch (e) { return false; }
    }

    function ecranJaParticipou(msg) {
      app.innerHTML = `
        <div class="roleta-header">
          <div class="badge-loja">Bónus Especial</div>
          <h1>Já participou</h1>
          <p class="subtitulo">${msg || 'Este dispositivo ou contacto já realizou o Bónus Especial.<br>Aguarde pelo anúncio de um novo Bónus.'}</p>
          <div style="margin-top:24px;display:flex;flex-direction:column;gap:12px;align-items:center">
            <a href="login.html" class="btn-girar" style="text-decoration:none;max-width:320px;text-align:center;display:block">Ir para o menu principal</a>
            <p style="font-size:13px;color:#94a3b8;max-width:320px">O menu principal pede a palavra-passe de administrador para aceder ao sistema.</p>
          </div>
        </div>`;
    }

    async function initRoletaBonusEspecial() {
      try {
        const cfg = await Storage.getConfig();
        const be = cfg.bonusEspecial || {};
        const adminTeste = isAdminTeste();

        if (!be.activo || !be.campanhaId) {
          app.innerHTML = `
            <div class="roleta-header">
              <div class="badge-loja">Bónus Especial</div>
              <h1>Indisponível</h1>
              <p class="subtitulo">Não há bónus especial activo de momento.</p>
              <p style="margin-top:20px"><a href="login.html" style="color:#a5b4fc">Ir para o menu principal</a></p>
            </div>`;
          return;
        }

        const campanhaId = be.campanhaId;

        // --- Modo teste admin: sem limite de dispositivo, roleta ilimitada ---
        if (adminTeste) {
          const participanteTeste = {
            id: 'teste_admin',
            nome: 'Admin (teste)',
            telefone: '',
            estado: 'registado',
            campanhaId
          };
          renderRoletaBonusEspecial(participanteTeste, campanhaId, be, { modoTeste: true });
          return;
        }

        const ja = await Storage.jaParticipouBonusEspecial(campanhaId);
        if (ja) {
          ecranJaParticipou();
          return;
        }

        let sessao = null;
        try { sessao = JSON.parse(sessionStorage.getItem('bonus_especial_sessao') || 'null'); } catch (e) {}
        if (!sessao || !sessao.participanteId || sessao.campanhaId !== campanhaId || sessao.modoTeste) {
          window.location.href = 'bonus-especial.html';
          return;
        }

        const participante = await Storage.getParticipanteBonusById(sessao.participanteId);
        if (!participante) {
          window.location.href = 'bonus-especial.html';
          return;
        }
        if (participante.estado === 'concluido' || participante.premioNome) {
          ecranJaParticipou('Este contacto já realizou o Bónus Especial.<br>Aguarde pelo anúncio de um novo Bónus.');
          return;
        }

        renderRoletaBonusEspecial(participante, campanhaId, be, { modoTeste: false });
      } catch (e) {
        console.error(e);
        app.innerHTML = `<div class="roleta-header"><h1>Erro</h1><p class="subtitulo">Não foi possível carregar a roleta.</p>
          <p style="margin-top:16px"><a href="login.html" style="color:#a5b4fc">Menu principal</a></p></div>`;
      }
    }

    async function renderRoletaBonusEspecial(participante, campanhaId, be, opts) {
      opts = opts || {};
      const modoTeste = !!opts.modoTeste;
      const premios = (await Storage.getPremios()).filter(p => p.activo);
      if (!premios.length) {
        app.innerHTML = `<div class="roleta-header"><h1>Sem prémios</h1><p class="subtitulo">Configure prémios activos no painel admin.</p>
          <p style="margin-top:16px"><a href="login.html" style="color:#a5b4fc">Menu principal</a></p></div>`;
        return;
      }

      app.innerHTML = `
        <div class="roleta-header">
          <div class="badge-loja">🔥 Bónus Especial${modoTeste ? ' · TESTE ADMIN' : ''}</div>
          <h1>${(be && be.nome) ? be.nome : 'Roleta Especial'}</h1>
          <p class="cliente-nome">${participante.nome || ''}</p>
          <p class="subtitulo">${modoTeste
            ? 'Modo teste: pode girar quantas vezes quiser (não bloqueia o dispositivo)'
            : 'Uma participação por contacto/dispositivo nesta campanha'}</p>
        </div>
        <div class="wheel-wrapper">
          <div class="wheel-pointer"></div>
          <div class="wheel" id="wheel"></div>
          <div class="wheel-center">★</div>
        </div>
        <button class="btn-girar" id="btnGirar">GIRAR A ROLETA</button>
        <div id="resultadoArea"></div>
        ${modoTeste ? '<p style="text-align:center;margin-top:12px"><a href="bonus-gestao.html" style="color:#a5b4fc">← Voltar à gestão do Bónus</a></p>' : ''}
      `;

      drawWheel(premios);

      let aGirar = false;
      document.getElementById('btnGirar').addEventListener('click', async () => {
        if (aGirar) return;
        const btn = document.getElementById('btnGirar');
        aGirar = true;
        btn.disabled = true;
        btn.textContent = 'A girar...';

        let resultado;
        if (modoTeste) {
          resultado = await Storage.realizarSorteioBonusEspecialTeste(campanhaId);
        } else {
          resultado = await Storage.realizarSorteioBonusEspecial(participante.id, campanhaId);
        }

        if (resultado.erro) {
          alert(resultado.erro);
          aGirar = false;
          btn.disabled = false;
          btn.textContent = 'GIRAR A ROLETA';
          if (!modoTeste && String(resultado.erro).indexOf('já participou') >= 0) {
            setTimeout(() => ecranJaParticipou(resultado.erro), 400);
          }
          return;
        }

        const { sorteio, premio } = resultado;
        const dur = animarRoletaParaPremio(premios, premio);

        let ticks = 0;
        const tickInterval = setInterval(() => {
          if (typeof playTick === 'function') playTick();
          ticks++;
          if (ticks > 55) clearInterval(tickInterval);
        }, 90);

        setTimeout(() => {
          clearInterval(tickInterval);
          if (typeof playWinSound === 'function') playWinSound();
          document.getElementById('resultadoArea').innerHTML = `
            <div class="resultado-box ganhou">
              <p class="premio-nome">${(premio.nome || '').replace(/</g,'&lt;')}</p>
              <p style="color:#94a3b8;font-size:14px">${(premio.descricao || '').replace(/</g,'&lt;')}</p>
              <p style="margin-top:12px;font-weight:700;color:#fbbf24">Código: ${sorteio.codigo || ''}</p>
              <p style="margin-top:8px;font-size:13px;color:#94a3b8">${modoTeste
                ? 'Modo teste — este resultado não bloqueia participantes reais.'
                : 'Apresente este código na loja para receber o prémio.'}</p>
            </div>`;
          if (typeof lancarConfetti === 'function') lancarConfetti();
          if (modoTeste) {
            aGirar = false;
            btn.disabled = false;
            btn.textContent = 'GIRAR NOVAMENTE (teste)';
          } else {
            btn.textContent = 'Participação concluída';
          }
        }, dur);
      });
    }


    function mostrarFormularioAcesso() {
      app.innerHTML = `
        <div class="roleta-header">
          <div class="badge-loja">Bónus Lodja - Compre e ganhe</div>
          <h1>Roleta de Prémios</h1>
          <p class="subtitulo">Para clientes que já compraram 5 ou mais peças</p>
        </div>

        <div class="acesso-form">
          <h2>Verificar acesso</h2>
          <p class="desc">Introduza o seu nome ou número de telefone para verificar se pode participar.</p>

          <div class="erro-msg" id="erroAcesso"></div>

          <div class="form-group">
            <label>Nome completo (opcional)</label>
            <input type="text" id="inputNome" placeholder="Ex: Maria Silva" autocomplete="name">
          </div>
          <div class="form-group">
            <label>Número de telefone *</label>
            <input type="tel" id="inputTelefone" placeholder="Ex: 84XXXXXXX" autocomplete="tel" required>
          </div>

          <button class="btn-verificar" id="btnVerificar">Verificar e Continuar</button>
        </div>
      `;

      document.getElementById('btnVerificar').addEventListener('click', verificarAcesso);
      document.getElementById('inputTelefone').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') verificarAcesso();
      });
    }

    function normalizarTelefone(tel) {
      return (tel || '').replace(/\D/g, ''); // só dígitos
    }

    async function verificarAcesso() {
      const nome = (document.getElementById('inputNome').value || '').trim().toLowerCase();
      const telefoneRaw = document.getElementById('inputTelefone').value.trim();
      const telefone = normalizarTelefone(telefoneRaw);
      const erroEl = document.getElementById('erroAcesso');

      erroEl.classList.remove('show');
      erroEl.textContent = '';

      if (!telefone || telefone.length < 8) {
        erroEl.textContent = 'Introduza um número de telefone válido.';
        erroEl.classList.add('show');
        return;
      }

      const clientes = await Storage.getClientes();

      // Procurar por telefone (prioridade) ou por nome
      let cliente = clientes.find(c => normalizarTelefone(c.telefone) === telefone);

      if (!cliente && nome) {
        cliente = clientes.find(c => (c.nome || '').toLowerCase().includes(nome) || nome.includes((c.nome || '').toLowerCase()));
      }

      if (!cliente) {
        erroEl.textContent = 'Não encontramos o seu registo. Confirme o número ou fale com a loja.';
        erroEl.classList.add('show');
        return;
      }

      // Verificar se já fez o sorteio
      if (cliente.tokenUsado) {
        const sorteios = await Storage.getSorteios();
        const sorteio = sorteios.find(s => s.clienteId === cliente.id);
        mostrarJaParticipou(cliente, sorteio);
        return;
      }

      // Verificar elegibilidade (5+ peças + grupo)
      if (!cliente.elegivel) {
        const pecas = cliente.totalPecas || 0;
        if (pecas < 5) {
          erroEl.textContent = `Ainda não atingiu as 5 peças (tem ${pecas}). Continue a comprar!`;
        } else if (!cliente.noGrupoWhatsapp) {
          erroEl.textContent = 'É necessário estar no grupo oficial do WhatsApp da loja.';
        } else {
          erroEl.textContent = 'Ainda não é elegível. Fale com a loja.';
        }
        erroEl.classList.add('show');
        return;
      }

      // Tudo ok → gerar token temporário se não tiver e mostrar roleta
      if (!cliente.token) {
        const novoToken = await Storage.gerarLink(cliente.id);
        if (!novoToken) {
          erroEl.textContent = 'Erro ao preparar o sorteio. Tente novamente.';
          erroEl.classList.add('show');
          return;
        }
        cliente = await Storage.getClienteById(cliente.id); // actualizar
      }

      renderRoleta(cliente, cliente.token);
    }

    // -------------------------------------------------------
    // MODO TOKEN EXCLUSIVO
    // -------------------------------------------------------
    async function initRoletaPorToken(token) {
      const cliente = await Storage.getClienteByToken(token);
      const sorteioExistente = await Storage.getSorteioByToken(token);

      if (!cliente) {
        app.innerHTML = `
          <div class="estado-erro">
            <div class="icon">❌</div>
            <h2>Link inválido</h2>
            <p>Este link não está associado a nenhum cliente.</p>
          </div>`;
        return;
      }

      if (cliente.tokenUsado || sorteioExistente) {
        mostrarJaParticipou(cliente, sorteioExistente);
        return;
      }

      renderRoleta(cliente, token);
    }

    function mostrarJaParticipou(cliente, sorteio) {
      const s = sorteio || {};
      app.innerHTML = `
        <div class="roleta-header">
          <div class="badge-loja">Bónus Lodja - Compre e ganhe</div>
          <h1>Sorteio já realizado</h1>
          <div class="cliente-nome">${App.escapeHtml(cliente.nome)}</div>
        </div>
        <div class="resultado-box ganhou">
          <h2>🎉 Já participou!</h2>
          <p class="premio-nome">${App.escapeHtml(s.premioNome || cliente.ultimoPremio || '—')}</p>
          <div class="codigo">${s.codigo || cliente.ultimoCodigo || '—'}</div>
          <p class="aviso">Guarde este código e apresente-o na loja para receber o seu prémio.</p>
          <p class="aviso mt-1">Data: ${App.formatDateTime(s.dataSorteio || cliente.dataSorteio)}</p>
        </div>`;
    }

    // -------------------------------------------------------
    // ROLETA (comum aos dois modos)
    // -------------------------------------------------------
    async function renderRoleta(cliente, token) {
      const premios = (await Storage.getPremios()).filter(p => p.activo);

      app.innerHTML = `
        <div class="roleta-header">
          <div class="badge-loja">Bónus Lodja - Compre e ganhe</div>
          <h1>Parabéns!</h1>
          <div class="cliente-nome">${App.escapeHtml(cliente.nome)}</div>
          <p class="subtitulo">Você cumpriu as condições e pode girar a roleta uma vez.</p>
        </div>

        <div class="wheel-wrapper">
          <div class="wheel-pointer"></div>
          <div class="wheel" id="wheel"></div>
          <div class="wheel-center">★</div>
        </div>

        <button class="btn-girar" id="btnGirar">GIRAR A ROLETA</button>
        <div id="resultadoArea"></div>
      `;

      drawWheel(premios);
      document.getElementById('btnGirar').addEventListener('click', () => girar(token, premios));
    }

    // Cores vivas por defeito (se o prémio não tiver cor)
    const CORES_VIVAS = ['#FF1744', '#FF9100', '#FFD600', '#00E676', '#00B0FF', '#D500F9', '#FF4081', '#651FFF'];

    /**
     * Layout único da roleta (mesma lógica do desenho e do giro).
     * Ângulos em graus, 0° = topo (ponteiro), sentido HORÁRIO (igual ao conic-gradient).
     */
    /**
     * Fatias IGUAIS: 1 prémio activo = 1 fatia (como roleta clássica do exemplo).
     * A probabilidade continua a decidir QUEM ganha no sorteio; o desenho fica claro.
     */
    function layoutRoleta(premios) {
      const n = premios.length || 1;
      const slice = 360 / n;
      return premios.map((p, i) => {
        const startDeg = i * slice;
        const endDeg = (i + 1) * slice;
        return { premio: p, index: i, startDeg, endDeg, midDeg: startDeg + slice / 2 };
      });
    }

    /** Só prémios com texto legível na roleta */
    function premiosParaRoleta(lista) {
      return (lista || []).filter(p => p && p.activo !== false).map((p, i) => {
        const nome = String(p.nome || '').trim();
        const desc = String(p.descricao || '').trim();
        let titulo = nome;
        if (!titulo || /^premio$/i.test(titulo) || titulo === '-' || titulo === '—') {
          titulo = desc || ('Prémio ' + (i + 1));
        }
        return Object.assign({}, p, { _tituloRoleta: titulo, _detalheRoleta: (desc && desc !== titulo) ? desc : '' });
      });
    }

    function indicePremioNaRoleta(premios, premio) {
      if (!premio || !premios || !premios.length) return 0;
      let idx = premios.findIndex(p => String(p.id) === String(premio.id));
      if (idx >= 0) return idx;
      idx = premios.findIndex(p => (p.nome || '') === (premio.nome || ''));
      if (idx >= 0) return idx;
      idx = premios.findIndex(p => (p._tituloRoleta || '') === (premio.nome || ''));
      return idx >= 0 ? idx : 0;
    }

    /**
     * Rotação CSS (horária) para o prémio vencedor ficar sob o ponteiro no TOPO.
     * Ponto a midDeg no disco, após rotate(R): posição ecrã = midDeg + R.
     * Queremos midDeg + R ≡ 0 (mod 360) ⇒ R ≡ -midDeg ≡ 360 - midDeg.
     */
    function calcularRotacaoFinal(premios, premio) {
      const lista = premiosParaRoleta(premios);
      const layout = layoutRoleta(lista);
      const idx = indicePremioNaRoleta(lista, premio);
      const seg = layout[idx];
      // Pousa dentro da fatia vencedora (não só no centro exacto)
      const span = Math.max(seg.endDeg - seg.startDeg, 0.01);
      const landDeg = seg.startDeg + span * (0.2 + Math.random() * 0.6);
      const voltas = 6 + Math.floor(Math.random() * 3); // 6–8 voltas inteiras
      const ajuste = (360 - (landDeg % 360)) % 360;
      return voltas * 360 + ajuste;
    }

    function animarRoletaParaPremio(premios, premio) {
      const wheel = document.getElementById('wheel');
      if (!wheel) return 5200;
      const rotacaoFinal = calcularRotacaoFinal(premios, premio);
      wheel.classList.add('spinning');
      wheel.style.transition = 'none';
      wheel.style.transform = 'rotate(0deg)';
      void wheel.offsetWidth;
      wheel.style.transition = 'transform 5s cubic-bezier(0.12, 0.75, 0.12, 1)';
      wheel.style.transform = 'rotate(' + rotacaoFinal + 'deg)';
      return 5200;
    }

    function corFatia(p, i) {
      const raw = p && p.cor ? String(p.cor).trim() : '';
      if (raw && /^#?[0-9A-Fa-f]{3,8}$/.test(raw.replace('#', ''))) {
        return raw.charAt(0) === '#' ? raw : ('#' + raw);
      }
      return CORES_VIVAS[i % CORES_VIVAS.length];
    }

    function contrasteTexto(hex) {
      try {
        let c = String(hex || '#333').replace('#', '');
        if (c.length === 3) c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
        const r = parseInt(c.slice(0, 2), 16) || 0;
        const g = parseInt(c.slice(2, 4), 16) || 0;
        const b = parseInt(c.slice(4, 6), 16) || 0;
        const L = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        return L > 0.55 ? '#111827' : '#ffffff';
      } catch (e) { return '#ffffff'; }
    }

    function drawWheel(premios) {
      const wheel = document.getElementById('wheel');
      if (!wheel || !premios.length) return;

      const lista = premiosParaRoleta(premios);
      const layout = layoutRoleta(lista);
      const n = layout.length;
      const gap = n > 12 ? 0.25 : 0.4; // % branco entre fatias

      const parts = [];
      layout.forEach((seg, i) => {
        const cor = corFatia(seg.premio, i);
        const a0 = (seg.startDeg / 360) * 100;
        const a1 = (seg.endDeg / 360) * 100;
        const g0 = a0 + gap / 2;
        const g1 = a1 - gap / 2;
        if (i === 0) {
          parts.push('#f8fafc 0% ' + g0 + '%');
        } else {
          parts.push('#f8fafc ' + (a0 - gap / 2) + '% ' + g0 + '%');
        }
        parts.push(cor + ' ' + g0 + '% ' + g1 + '%');
        if (i === n - 1) {
          parts.push('#f8fafc ' + g1 + '% 100%');
        }
      });

      wheel.style.background = 'conic-gradient(from -90deg, ' + parts.join(', ') + ')';

      let labels = wheel.querySelector('.wheel-labels');
      if (!labels) {
        labels = document.createElement('div');
        labels.className = 'wheel-labels';
        wheel.appendChild(labels);
      }
      labels.innerHTML = '';

      layout.forEach((seg, i) => {
        const p = seg.premio;
        const mid = seg.midDeg;
        const cor = corFatia(p, i);
        const titulo = p._tituloRoleta || p.nome || ('Prémio ' + (i + 1));
        // Texto grande no estilo roleta clássica (inclinado com a fatia)
        const label = document.createElement('div');
        label.className = 'wheel-label wheel-label-classic';
        label.style.color = contrasteTexto(cor);
        // Quebra em 2 linhas se for longo (ex: "Pega 1 leva 2")
        let t1 = titulo;
        let t2 = '';
        if (titulo.length > 12) {
          const sp = titulo.lastIndexOf(' ', 12);
          if (sp > 4) {
            t1 = titulo.slice(0, sp);
            t2 = titulo.slice(sp + 1);
          } else {
            t1 = titulo.slice(0, 11);
            t2 = titulo.slice(11);
          }
        }
        label.innerHTML = '<span class="wl1">' + t1.replace(/</g,'&lt;') + '</span>' +
          (t2 ? '<span class="wl2">' + t2.replace(/</g,'&lt;') + '</span>' : '');

        // Estilo exemplo: texto segue a fatia (sem "des-rodar" horizontal)
        // Virar 180° na metade inferior para ler de pé
        const flip = (mid > 90 && mid < 270);
        const rot = flip ? (mid + 180) : mid;
        const dist = n <= 6 ? 95 : (n <= 10 ? 102 : 108);
        label.style.transform = 'rotate(' + rot + 'deg) translateY(-' + dist + 'px)';
        labels.appendChild(label);
      });
    }

    // Som de fundo / giro (Web Audio - sem ficheiro externo)
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }
    function playTick() {
      try {
        const ctx = getAudio();
        const o = ctx.createOscillator();
        const o2 = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sawtooth';
        o2.type = 'square';
        o.frequency.value = 220 + Math.random() * 180;
        o2.frequency.value = 440 + Math.random() * 320;
        g.gain.value = 0.14;
        o.connect(g); o2.connect(g); g.connect(ctx.destination);
        o.start(); o2.start();
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
        o.stop(ctx.currentTime + 0.08);
        o2.stop(ctx.currentTime + 0.08);
      } catch (e) {}
    }
    function playWinSound() {
      try {
        const ctx = getAudio();
        // Fanfarra mais explosiva
        const notes = [523, 659, 784, 1046, 784, 1046, 1319];
        notes.forEach((freq, i) => {
          const o = ctx.createOscillator();
          const o2 = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = 'square';
          o2.type = 'triangle';
          o.frequency.value = freq;
          o2.frequency.value = freq * 2;
          g.gain.value = 0.16;
          o.connect(g); o2.connect(g); g.connect(ctx.destination);
          const t0 = ctx.currentTime + i * 0.09;
          o.start(t0); o2.start(t0);
          g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.28);
          o.stop(t0 + 0.3); o2.stop(t0 + 0.3);
        });
        // Boom final
        const boom = ctx.createOscillator();
        const bg = ctx.createGain();
        boom.type = 'sawtooth';
        boom.frequency.value = 80;
        bg.gain.value = 0.22;
        boom.connect(bg); bg.connect(ctx.destination);
        boom.start(ctx.currentTime + 0.65);
        boom.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 1.1);
        bg.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.15);
        boom.stop(ctx.currentTime + 1.2);
      } catch (e) {}
    }

    async function girar(token, premios) {
      const btn = document.getElementById('btnGirar');
      btn.disabled = true;
      btn.textContent = 'A girar...';

      // Resultado determinado ANTES da animação
      const resultado = await Storage.realizarSorteio(token);

      if (resultado.erro) {
        alert(resultado.erro);
        btn.disabled = false;
        btn.textContent = 'GIRAR A ROLETA';
        return;
      }

      const { sorteio, premio } = resultado;
      const dur = animarRoletaParaPremio(premios, premio);

      let ticks = 0;
      const tickInterval = setInterval(() => {
        playTick();
        ticks++;
        if (ticks > 55) clearInterval(tickInterval);
      }, 90);

      setTimeout(() => {
        clearInterval(tickInterval);
        playWinSound();
        mostrarResultado(sorteio, premio);
        lancarConfetti();
      }, dur);
    }

    function mostrarResultado(sorteio, premio) {
      document.getElementById('resultadoArea').innerHTML = `
        <div class="resultado-box ganhou">
          <h2>🎉 Parabéns, ganhou!</h2>
          <p class="premio-nome">${App.escapeHtml(premio.nome)}</p>
          <p style="color:#94a3b8;font-size:14px">${App.escapeHtml(premio.descricao || '')}</p>
          <div class="codigo">${sorteio.codigo}</div>
          <p class="aviso">Guarde este código e apresente-o na loja para receber o seu prémio.</p>
          <p class="aviso">Este sorteio já não pode ser repetido.</p>
        </div>
      `;
      document.getElementById('btnGirar').textContent = 'Sorteio realizado';
    }

    function lancarConfetti() {
      const container = document.getElementById('confetti');
      const cores = ['#6366f1', '#10b981', '#f59e0b', '#ec4899', '#3b82f6', '#fbbf24'];
      for (let i = 0; i < 80; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = Math.random() * 100 + '%';
        el.style.background = cores[Math.floor(Math.random() * cores.length)];
        el.style.width = (6 + Math.random() * 8) + 'px';
        el.style.height = (6 + Math.random() * 8) + 'px';
        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        el.style.animationDelay = (Math.random() * 0.5) + 's';
        el.style.animationDuration = (2.5 + Math.random() * 2) + 's';
        container.appendChild(el);
      }
      setTimeout(() => { container.innerHTML = ''; }, 5000);
    }
  </script>
