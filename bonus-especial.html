<!DOCTYPE html>
<html lang="pt">
<head>
  <script>
    (function () {
      try {
        var path = location.pathname;
        var dir = path.endsWith('/') ? path : path.replace(/\/[^\/]*$/, '/');
        if (!document.querySelector('base')) {
          var b = document.createElement('base');
          b.href = location.origin + dir;
          document.head.insertBefore(b, document.head.firstChild);
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bónus Especial — Bónus Lodja</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #0f172a 0%, #1e1b4b 45%, #0f172a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Inter, system-ui, sans-serif;
      color: #e2e8f0;
    }
    .card-esp {
      max-width: 440px;
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 32px 28px;
      text-align: center;
      box-shadow: 0 24px 48px rgba(0,0,0,.35);
    }
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 12px; }
    .desc { color: #94a3b8; font-size: 15px; line-height: 1.55; margin-bottom: 20px; white-space: pre-wrap; }
    .codigo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #fbbf24;
      background: #0f172a;
      border: 2px dashed #f59e0b;
      border-radius: 12px;
      padding: 16px;
      margin: 16px 0 8px;
    }
    .hint { font-size: 13px; color: #64748b; margin-top: 8px; }
    .off {
      color: #94a3b8;
      font-size: 15px;
    }
    a.voltar { display: inline-block; margin-top: 24px; color: #a5b4fc; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card-esp" id="box">
    <p class="off">A carregar...</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="storage.js"></script>
  <script>
    initSupabase();
    (async () => {
      const box = document.getElementById('box');
      try {
        const cfg = await Storage.getConfig();
        const be = cfg.bonusEspecial || {};
        if (!be.activo || !be.nome) {
          box.innerHTML = `
            <div class="badge" style="background:#475569">Indisponível</div>
            <h1>Bónus especial</h1>
            <p class="off">Neste momento não há bónus especial activo.<br>Volte a verificar em breve ou pergunte na loja.</p>
            <a class="voltar" href="login.html">Área admin</a>
          `;
          return;
        }
        box.innerHTML = `
          <div class="badge">🔥 Bónus especial</div>
          <h1>${escapeHtml(be.nome)}</h1>
          <p class="desc">${escapeHtml(be.descricao || 'Apresente esta oferta no balcão ao fazer a sua compra.')}</p>
          ${be.codigo ? `<div class="codigo">${escapeHtml(be.codigo)}</div><p class="hint">Mostre este código na loja</p>` : ''}
          <a class="voltar" href="roleta.html">Ir para a roleta</a>
        `;
      } catch (e) {
        box.innerHTML = `<p class="off">Não foi possível carregar a oferta. Verifique a ligação.</p>`;
      }
    })();
    function escapeHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
