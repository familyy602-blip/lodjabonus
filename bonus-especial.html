<!DOCTYPE html>
<html lang="pt">
<head>
  <script>
    (function () {
      try {
        var path = location.pathname;
        var dir = path.endsWith('/') ? path : path.replace(/\/[^\/]*$/, '/');
        if (!document.querySelector('base')) {
          var b = document.createElement('base');
          b.href = location.origin + dir;
          document.head.insertBefore(b, document.head.firstChild);
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <title>Bónus Especial — Bónus Lodja</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #0f172a 0%, #1e1b4b 45%, #0f172a 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 24px; font-family: Inter, system-ui, sans-serif; color: #e2e8f0;
    }
    .card-esp {
      max-width: 440px; width: 100%; background: #1e293b; border: 1px solid #334155;
      border-radius: 20px; padding: 32px 28px; text-align: center;
      box-shadow: 0 24px 48px rgba(0,0,0,.35);
    }
    .badge {
      display: inline-block; background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; padding: 6px 14px; border-radius: 20px; margin-bottom: 16px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 12px; }
    .desc { color: #94a3b8; font-size: 15px; line-height: 1.55; margin-bottom: 20px; white-space: pre-wrap; }
    .off { color: #94a3b8; font-size: 15px; }
    .form-acesso { text-align: left; margin-top: 8px; }
    .form-acesso label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
    .form-acesso input {
      width: 100%; padding: 12px 14px; background: #0f172a; border: 1px solid #334155;
      border-radius: 10px; color: #f1f5f9; font-size: 16px; font-family: inherit; margin-bottom: 14px;
    }
    .form-acesso input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.25); }
    .btn-confirmar {
      width: 100%; padding: 14px; background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600;
      cursor: pointer; margin-top: 4px; min-height: 48px;
    }
    .btn-confirmar:disabled { opacity: 0.6; cursor: not-allowed; }
    .erro-form {
      display: none; background: rgba(239,68,68,0.15); color: #fca5a5;
      border: 1px solid rgba(239,68,68,0.35); border-radius: 10px; padding: 10px 12px;
      font-size: 13px; margin-bottom: 12px; text-align: left;
    }
    .erro-form.show { display: block; }
    .btn-retry {
      margin-top: 16px; padding: 12px 18px; border-radius: 10px; border: 1px solid #475569;
      background: #334155; color: #e2e8f0; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card-esp" id="box"><p class="off">A carregar...</p></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="storage.js"></script>
  <script>
    function escapeHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function normalizarTelefone(t) { return String(t || '').replace(/\D/g, ''); }

    function ensureSupabase() {
      if (window.supabaseClient) return true;
      if (typeof initSupabase === 'function') {
        initSupabase();
      }
      return !!window.supabaseClient;
    }

    function irParaRoletaEspecial(cliente, campanhaId) {
      try {
        sessionStorage.setItem('bonus_especial_sessao', JSON.stringify({
          clienteId: cliente.id,
          nome: cliente.nome,
          telefone: cliente.telefone,
          campanhaId: campanhaId,
          ts: Date.now()
        }));
      } catch (e) {}
      window.location.href = 'roleta.html?modo=especial';
    }

    function mostrarBloqueado() {
      document.getElementById('box').innerHTML = `
        <div class="badge" style="background:#475569">Já participou</div>
        <h1>Bónus Especial</h1>
        <p class="off">Este dispositivo já participou no Bónus Especial.<br><br>Aguarde pelo anúncio de um novo Bónus.</p>
      `;
    }

    function mostrarFormulario(be, campanhaId) {
      const box = document.getElementById('box');
      box.innerHTML = `
        <div class="badge">🔥 Bónus especial</div>
        <h1>${escapeHtml(be.nome || 'Bónus Especial')}</h1>
        <p class="desc">${escapeHtml(be.descricao || 'Preencha os dados para girar a roleta do bónus especial.')}</p>
        <div class="erro-form" id="erroAcesso"></div>
        <form class="form-acesso" id="formAcesso">
          <label for="nomeAcesso">Nome completo *</label>
          <input type="text" id="nomeAcesso" required autocomplete="name" placeholder="O seu nome">
          <label for="telAcesso">Contacto / WhatsApp *</label>
          <input type="tel" id="telAcesso" required autocomplete="tel" placeholder="8XXXXXXXX" inputmode="numeric">
          <button type="submit" class="btn-confirmar" id="btnAcesso">Continuar para a Roleta</button>
        </form>
      `;

      document.getElementById('formAcesso').addEventListener('submit', async (e) => {
        e.preventDefault();
        const erroEl = document.getElementById('erroAcesso');
        const btn = document.getElementById('btnAcesso');
        erroEl.classList.remove('show');
        const nome = document.getElementById('nomeAcesso').value.trim();
        const telefone = normalizarTelefone(document.getElementById('telAcesso').value);
        if (!nome || nome.length < 2) {
          erroEl.textContent = 'Introduza o seu nome.'; erroEl.classList.add('show'); return;
        }
        if (!telefone || telefone.length < 8) {
          erroEl.textContent = 'Introduza um contacto válido (mín. 8 dígitos).'; erroEl.classList.add('show'); return;
        }
        if (!ensureSupabase()) {
          erroEl.textContent = 'Ligação ao servidor não pronta. Recarregue a página.';
          erroEl.classList.add('show'); return;
        }
        btn.disabled = true;
        btn.textContent = 'A registar...';
        try {
          const clientes = await Storage.getClientes();
          let cliente = clientes.find(c => normalizarTelefone(c.telefone) === telefone);
          if (cliente) {
            if ((!cliente.nome || cliente.nome.length < 2) && nome) {
              try { await Storage.updateCliente(cliente.id, { nome }); cliente.nome = nome; } catch (e) {}
            }
          } else {
            cliente = await Storage.addCliente({
              nome, telefone, totalPecas: 0, totalCompras: 0, noGrupoWhatsapp: false, estado: 'activo'
            });
          }
          irParaRoletaEspecial(cliente, campanhaId);
        } catch (err) {
          console.error(err);
          erroEl.textContent = 'Erro ao registar: ' + (err.message || err);
          erroEl.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Continuar para a Roleta';
        }
      });
    }

    async function iniciar() {
      const box = document.getElementById('box');
      box.innerHTML = '<p class="off">A carregar...</p>';

      if (typeof Storage === 'undefined' || typeof initSupabase !== 'function') {
        box.innerHTML = `
          <p class="off">Falha ao carregar os scripts do sistema.</p>
          <button class="btn-retry" type="button" onclick="location.reload()">Tentar de novo</button>
        `;
        return;
      }

      if (!ensureSupabase()) {
        // espera curta pela CDN
        await new Promise(r => setTimeout(r, 400));
        if (!ensureSupabase()) {
          box.innerHTML = `
            <p class="off">Não foi possível ligar ao servidor (Supabase).<br>Verifique a internet.</p>
            <button class="btn-retry" type="button" onclick="location.reload()">Tentar de novo</button>
          `;
          return;
        }
      }

      try {
        const cfg = await Storage.getConfig();
        const be = (cfg && cfg.bonusEspecial) ? cfg.bonusEspecial : {};

        if (!be.activo || !be.nome) {
          box.innerHTML = `
            <div class="badge" style="background:#475569">Indisponível</div>
            <h1>Bónus especial</h1>
            <p class="off">Neste momento não há bónus especial activo.<br>Peça na loja para activarem a campanha em <strong>Configurações</strong>.</p>
          `;
          return;
        }

        let campanhaId = be.campanhaId;
        if (!campanhaId) {
          campanhaId = 'camp_' + Date.now().toString(36);
          be.campanhaId = campanhaId;
          cfg.bonusEspecial = be;
          try { await Storage.saveConfig(cfg); } catch (e) { console.warn('save campanhaId', e); }
        }

        let ja = false;
        try {
          if (typeof Storage.jaParticipouBonusEspecial === 'function') {
            ja = await Storage.jaParticipouBonusEspecial(campanhaId);
          }
        } catch (e) {
          console.warn('check participacao', e);
          try { ja = localStorage.getItem('bonus_esp_done_' + campanhaId) === '1'; } catch (e2) { ja = false; }
        }
        if (ja) { mostrarBloqueado(); return; }

        try {
          const raw = sessionStorage.getItem('bonus_especial_sessao');
          if (raw) {
            const s = JSON.parse(raw);
            if (s && s.clienteId && s.campanhaId === campanhaId) {
              window.location.href = 'roleta.html?modo=especial';
              return;
            }
          }
        } catch (e) {}

        mostrarFormulario(be, campanhaId);
      } catch (e) {
        console.error(e);
        box.innerHTML = `
          <p class="off">Não foi possível carregar.<br><span style="font-size:12px;color:#64748b">${escapeHtml(e.message || String(e))}</span></p>
          <button class="btn-retry" type="button" onclick="location.reload()">Tentar de novo</button>
        `;
      }
    }

    // arranque
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', iniciar);
    } else {
      iniciar();
    }
  </script>
</body>
</html>
