<!DOCTYPE html>
<html lang="pt">
<head>

  <script>
    /* Base path automático para GitHub Pages (repo em subpasta) */
    (function () {
      try {
        var path = location.pathname;
        var dir = path.endsWith('/') ? path : path.replace(/\/[^\/]*$/, '/');
        if (!document.querySelector('base')) {
          var b = document.createElement('base');
          b.href = location.origin + dir;
          document.head.insertBefore(b, document.head.firstChild);
        }
      } catch (e) {}
    })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <title>Sorteios — Bónus Lodja - Compre e ganhe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">B</div>
        <div><h1>Bónus Lodja - Compre e ganhe</h1><span>Painel Admin</span></div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item"><span class="icon">📊</span> Dashboard</a>
        <a href="clientes.html" class="nav-item"><span class="icon">👥</span> Clientes</a>
        <a href="compras.html" class="nav-item"><span class="icon">🛒</span> Compras</a>
        <a href="elegiveis.html" class="nav-item"><span class="icon">⭐</span> Elegíveis</a>
        <a href="sorteios.html" class="nav-item active"><span class="icon">🎡</span> Sorteios</a>
        <a href="premios.html" class="nav-item"><span class="icon">🎁</span> Prémios</a>
        <a href="entregas.html" class="nav-item"><span class="icon">📦</span> Entregas</a>
        <a href="relatorios.html" class="nav-item"><span class="icon">📈</span> Relatórios</a>
        <a href="bonus-especial.html" class="nav-item" target="_blank"><span class="icon">🔥</span> Bónus Especial</a>
        <a href="configuracoes.html" class="nav-item"><span class="icon">⚙️</span> Configurações</a>
      </nav>
      <div class="sidebar-footer">
        <button class="nav-item" onclick="Auth.logout()"><span class="icon">🚪</span> Sair</button>
      </div>
    </aside>
    <div class="sidebar-overlay"></div>

    <div class="main-content">
      <header class="topbar">
        <div class="d-flex align-center gap-2">
          <button class="menu-toggle">☰</button>
          <h2>Sorteios</h2>
        </div>
      </header>

      <div class="content">
        <div class="card">
          <div class="card-header">
            <div class="search-box">
              <input type="text" id="search" class="form-control" placeholder="Pesquisar por nome, telefone ou código...">
            </div>
            <select id="filterEstado" class="form-control" style="width:auto">
              <option value="">Todos os estados</option>
              <option value="premio_pendente">Prémio pendente</option>
              <option value="entregue">Entregue</option>
              <option value="cancelado">Cancelado</option>
            </select>
          </div>
          <div class="card-body">
            <table>
              <thead>
                <tr>
                  <th>Cliente</th>
                  <th>Contacto</th>
                  <th>Prémio</th>
                  <th>Código</th>
                  <th>Data Sorteio</th>
                  <th>Estado</th>
                  <th>Acções</th>
                </tr>
              </thead>
              <tbody id="tabela"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="storage.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script>
    initSupabase();
    if (!Auth.requireAuth()) throw new Error("Não autenticado");

    async function render() {
      const search = document.getElementById('search').value.toLowerCase();
      const filtro = document.getElementById('filterEstado').value;
      let sorteios = await Storage.getSorteios();

      if (search) {
        sorteios = sorteios.filter(s =>
          (s.clienteNome || '').toLowerCase().includes(search) ||
          (s.clienteTelefone || '').includes(search) ||
          (s.codigo || '').toLowerCase().includes(search) ||
          (s.premioNome || '').toLowerCase().includes(search)
        );
      }
      if (filtro) sorteios = sorteios.filter(s => s.estado === filtro);

      const tbody = document.getElementById('tabela');
      if (sorteios.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="icon">🎡</div><h4>Nenhum sorteio encontrado</h4></div></td></tr>`;
        return;
      }

      tbody.innerHTML = sorteios.map(s => {
        let badge = 'badge-muted', label = s.estado;
        if (s.estado === 'premio_pendente') { badge = 'badge-warning'; label = 'Prémio pendente'; }
        if (s.estado === 'entregue') { badge = 'badge-success'; label = 'Entregue'; }
        if (s.estado === 'cancelado') { badge = 'badge-danger'; label = 'Cancelado'; }
        return `
          <tr>
            <td><strong>${App.escapeHtml(s.clienteNome)}</strong></td>
            <td>${App.escapeHtml(s.clienteTelefone)}</td>
            <td>${App.escapeHtml(s.premioNome)}</td>
            <td><code>${s.codigo}</code></td>
            <td>${App.formatDateTime(s.dataSorteio)}</td>
            <td><span class="badge ${badge}">${label}</span></td>
            <td>
              ${s.estado === 'premio_pendente'
                ? `<button class="btn btn-success btn-sm" onclick="marcarEntregue('${s.id}')">Marcar Entregue</button>`
                : (s.dataEntrega ? App.formatDate(s.dataEntrega) : '—')}
            </td>
          </tr>`;
      }).join('');
    }

    async function marcarEntregue(id) {
      if (!App.confirm('Confirmar entrega do prémio?')) return;
      try {
        await Storage.marcarEntregue(id);
        App.toast('Prémio marcado como entregue!', 'success');
        await render();
      } catch (e) {
        App.toast('Erro', 'error');
      }
    }

    document.getElementById('search').addEventListener('input', () => render());
    document.getElementById('filterEstado').addEventListener('change', () => render());
    render();
  </script>
</body>
</html>
